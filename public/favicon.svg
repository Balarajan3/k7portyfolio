<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle with glowing border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="2.5" />
  
  <!-- Subtle Glow Layer -->
  <circle cx="46" cy="18" r="18" fill="url(#glowGrad)" opacity="0.35" />

  <!-- Monogram K7 -->
  <g filter="url(#shadow)">
    <!-- K Vertical Stem -->
    <path d="M14 16C14 14.8954 14.8954 14 16 14H20C21.1046 14 22 14.8954 22 16V48C22 49.1046 21.1046 50 20 50H16C14.8954 50 14 49.1046 14 48V16Z" fill="#FFFFFF"/>
    
    <!-- K Diagonal Branches -->
    <path d="M21 32L30.5 16.5C31 15.6 31.9 15 32.9 15H37C37.9 15 38.4 16.1 37.8 16.8L27.5 33L38.2 47.2C38.8 48 38.3 49 37.3 49H33C32.1 49 31.2 48.4 30.7 47.6L21 34V32Z" fill="#FFFFFF"/>
    
    <!-- 7 Stylized Top & Diagonal Stem -->
    <path d="M37 17C37 15.9 37.9 15 39 15H51C52.1 15 53 15.9 53 17V19.5C53 20.3 52.5 21 51.8 21.3L44.5 47.5C44.2 48.4 43.4 49 42.4 49H38.5C37.5 49 37 47.8 37.5 47L45 22H39C37.9 22 37 21.1 37 20V17Z" fill="url(#brandGrad)"/>
  </g>

  <!-- UI/UX Designer Precision Dot -->
  <circle cx="51.5" cy="15.5" r="2.5" fill="#38bdf8" />
</svg>
